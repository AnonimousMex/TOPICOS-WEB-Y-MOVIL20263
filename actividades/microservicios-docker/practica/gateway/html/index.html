<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práctica — Microservicios</title>
<style>body{font:16px system-ui;background:#f2f5fa;color:#132337;margin:32px auto;max-width:1000px;padding:0 20px}form{background:white;padding:24px;border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}label{display:grid;gap:6px}input,select,button{font:inherit;padding:10px;border:1px solid #bbc7d5;border-radius:6px}button{background:#174d80;color:white;cursor:pointer}pre{white-space:pre-wrap;background:#10253b;color:#f0f7ff;padding:20px;border-radius:12px}h1{font-size:28px}@media(max-width:650px){form{grid-template-columns:1fr}}</style>
<h1>Crear pedido · Microservicios</h1><p>Diego Rivera Cisneros · 22121364</p><form id="pedido"><label>Distancia (km)<input name="distancia_km" type="number" step="any" value="12.64" required></label><label>Peso (kg)<input name="peso_kg" type="number" step="any" value="0.31" required></label><label>Largo (cm)<input name="largo_cm" type="number" step="any" value="11.7" required></label><label>Ancho (cm)<input name="ancho_cm" type="number" step="any" value="7.6" required></label><label>Alto (cm)<input name="alto_cm" type="number" step="any" value="10.6" required></label><label>Volumen (L)<input name="volumen_l" type="number" step="any" value="0.94" required></label><label>Frágil (0/1)<input name="fragil" type="number" step="any" value="0" required></label><label>Refrigerado (0/1)<input name="refrigerado" type="number" step="any" value="0" required></label><label>Valor declarado (MXN)<input name="valor_declarado_mxn" type="number" step="any" value="4603" required></label><label>Prioridad<select name="prioridad"><option value="normal">normal</option><option value="express">express</option><option value="mismo_dia" selected>mismo_dia</option></select></label><label>Zona destino<select name="zona_destino"><option value="centro">centro</option><option value="residencial">residencial</option><option value="periferia" selected>periferia</option><option value="rural">rural</option></select></label><label>Clima<select name="clima"><option value="despejado" selected>despejado</option><option value="lluvia">lluvia</option><option value="viento_fuerte">viento_fuerte</option></select></label><label>Hora de salida<input name="hora_salida" type="number" step="any" value="3" required></label><label>Trafico<select name="trafico"><option value="bajo">bajo</option><option value="medio" selected>medio</option><option value="alto">alto</option></select></label><label>Modelo<select name="modelo"><option value="arbol" selected>arbol</option><option value="bosque">bosque</option><option value="red">red</option></select></label><button type="submit">Crear pedido</button></form><h2>Resultado</h2><pre id="resultado" aria-live="polite">Sin solicitudes.</pre>
<script>const form=document.querySelector('form'),out=document.querySelector('#resultado');form.addEventListener('submit',async event=>{event.preventDefault();const datos=Object.fromEntries(new FormData(form));form.querySelectorAll('input[type=number]').forEach(e=>datos[e.name]=Number(e.value));const boton=form.querySelector('button');boton.disabled=true;out.textContent='Procesando…';try{const r=await fetch('/pedidos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)});out.textContent='HTTP '+r.status+'\n'+JSON.stringify(await r.json(),null,2)}catch(e){out.textContent='No fue posible contactar el servidor.'}finally{boton.disabled=false}});</script></html>
