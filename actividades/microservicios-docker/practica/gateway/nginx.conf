events {}
http {
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 80;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }
    location = /pedidos {
      set $pedidos http://pedidos:8001;
      proxy_pass $pedidos/pedidos;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }
    location = /salud/pedidos { set $pedidos http://pedidos:8001; proxy_pass $pedidos/salud; }
    location = /salud/recomendar { set $recomendar http://recomendar:8002; proxy_pass $recomendar/salud; }
  }
}
